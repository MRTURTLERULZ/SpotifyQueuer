[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rubik-spotify-queue"
version = "0.1.0"
description = "Rubik Pi Spotify polling and ML queue service"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0.0,<2.0",
  "httpx>=0.26.0,<1.0",
  "numpy>=1.26.0,<3.0",
  "pandas>=2.1.0,<3.0",
  "pydantic>=2.5.0,<3.0",
  "pydantic-settings>=2.1.0,<3.0",
  "python-dotenv>=1.0.0,<2.0",
  "rich>=13.7.0,<15.0",
]

[project.optional-dependencies]
tensorflow = [
  "tensorflow>=2.15.0,<3.0 ; python_version < '3.14'",
]
dev = [
  "pytest>=8.0.0,<9.0",
]

[project.scripts]
rubik-spotify-queue = "rubik_spotify_queue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

